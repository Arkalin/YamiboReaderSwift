# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-26

    steps:
    - uses: actions/checkout@v4
    - name: Show toolchain
      run: |
        xcodebuild -version
        swift --version
    - name: Build
      run: |
        xcodebuild build \
          -project YamiboReader.xcodeproj \
          -scheme YamiboReader \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          CODE_SIGNING_ALLOWED=NO
    - name: Run core tests
      run: swift test --filter YamiboReaderCoreTests
    - name: Run UI tests
      run: |
        xcodebuild test \
          -quiet \
          -project YamiboReader.xcodeproj \
          -scheme YamiboReader \
          -testPlan YamiboReaderUITests \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          -only-testing:YamiboReaderUITests \
          -collect-test-diagnostics never \
          CODE_SIGNING_ALLOWED=NO
